name: TMDB (The Movie Database)
# Films and TV episodes from themoviedb.org — concert films, opera and
# ballet productions, documentaries. Needs an API key: Markers as Chapters'
# setting "TMDB API key", config.json next to the script, or TMDB_API_KEY.
sceneByURL:
  - action: script
    url:
      - themoviedb.org/movie/
      - themoviedb.org/tv/
    script:
      - python
      - tmdb.py
      - url
sceneByName:
  action: script
  script:
    - python
    - tmdb.py
    - name
sceneByQueryFragment:
  action: script
  script:
    - python
    - tmdb.py
    - query
sceneByFragment:
  action: script
  script:
    - python
    - tmdb.py
    - fragment
