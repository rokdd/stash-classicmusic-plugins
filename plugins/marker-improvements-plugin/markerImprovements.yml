name: Marker Improvements
description: "Shows every one of a scene marker's tags that has an image, mounted directly inside Stash's own colored marker indicator on the video's seek bar, so it shows and hides right along with that indicator. Click an icon to jump to that marker. Also marker scrapers: import markers (chapters from the video file or YouTube, a pasted tracklist or text file) like Stash scrapes scenes."
version: 0.0.32
url: https://github.com/rokdd/stash-classicmusic-plugins/tree/main/plugins/marker-improvements-plugin
exec:
  - python
  - "{pluginDir}/marker_scrapers.py"
interface: raw
ui:
  javascript:
    - marker-symbols.js
    - marker-scrapers.js
settings:
  tagStyles:
    displayName: Custom styles per tag
    description: "Format: name { css } — repeat for more rules. Example: Violin { outline: 2px solid gold } Piano, Cello { opacity: .6 } * { filter: grayscale(1) }. A rule applies to every tag whose name contains that text (upper/lower case ignored). With * in a name it's a pattern for the whole name: Solo* = starts with Solo, *Concerto = ends with Concerto. Separate several names with commas; * alone means every icon. Later rules win over earlier ones."
    type: STRING
  bubbleStyles:
    displayName: Custom styles per bubble
    description: "Same format as Custom styles per tag, but the CSS goes on the whole bubble of a marker. A rule applies when any of the marker's tags (with or without an image) contains its text, or matches it as a pattern when it has a * (e.g. Solo*). Example: Concerto { background: #ffe9b0; border: 2px solid #c90 } Solo { transform: scale(1.2); transform-origin: left bottom }. * means every bubble."
    type: STRING
  styleParentTags:
    displayName: Custom styles also match parent tags
    description: "When on, a rule in either custom style setting also applies to a tag if any tag above it (its parents, their parents, …) contains the rule's text. E.g. Strings { outline: 2px solid gold } then also styles Violin, Viola and Cello if they're sub-tags of Strings."
    type: BOOLEAN
  showStashMarkerList:
    displayName: Also show Stash's own marker list
    description: "Off: in a scene's Markers tab, only this plugin's marker list (screenshots, details, edit in place) is shown, and Stash's own list below it is hidden. On: both are shown."
    type: BOOLEAN
  markerTagsOnlyUnder:
    displayName: "Marker tags: only under"
    description: "When editing a marker, its tag fields only offer tags below these tags (at any depth). Tag names separated by commas, e.g. Instruments, Works. Empty: all tags. Tag fields elsewhere in Stash aren't affected."
    type: STRING
  markerTagsNotUnder:
    displayName: "Marker tags: not under"
    description: "When editing a marker, its tag fields leave out these tags and everything below them. Tag names separated by commas, e.g. Genres, Technical. Works together with \"only under\"."
    type: STRING
  editMarkerOnClick:
    displayName: Click on a marker opens the edit marker dialog
    description: "Clicking a marker's icon, or its colored range on the seek bar, jumps to it and opens Stash's edit marker dialog. Switch off to only jump to the marker."
    type: BOOLEAN
  scrapedMarkerTag:
    displayName: Primary tag for scraped markers
    description: "Every marker needs a primary tag. Markers from a marker scraper get this one when the scraper doesn't name one (you can change it in the scrape dialog). Created if it doesn't exist yet. Empty: Chapter."
    type: STRING
  markerScrapersPath:
    displayName: Marker scrapers folder
    description: "Optional: a folder on the server with marker scrapers of your own — .yaml files like Stash's scrapers, with markerByFragment, markerByURL and/or markerByText (action: script). See the plugin's README. The built-in ones (video file chapters, online chapters, plain text) are always there."
    type: STRING
  ytdlpPath:
    displayName: Path to yt-dlp
    description: "For the online chapters scraper. Leave empty to use Scene Improvements' setting if it has one, else yt-dlp on the server's PATH."
    type: STRING
