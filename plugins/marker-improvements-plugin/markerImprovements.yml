name: Marker Improvements
description: >-
  Shows each scene marker's tag image on the video scrubber, positioned at
  that marker's exact timestamp. Hidden until you hover the scrubber, so
  it stays out of the way otherwise. Click an icon to jump to that marker.
  A tag with no image uploaded gets a small default pin instead.
version: 0.0.1
url: https://github.com/yourname/stash-marker-improvements
ui:
  javascript:
    - marker-symbols.js
