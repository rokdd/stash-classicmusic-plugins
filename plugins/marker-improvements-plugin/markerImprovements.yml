name: Marker Improvements
description: "Shows every one of a scene marker's tags that has an image, mounted directly inside Stash's own colored marker indicator on the video scrubber, so it shows and hides right along with that indicator. Click an icon to jump to that marker."
version: 0.0.26
url: https://github.com/rokdd/stash-classicmusic-plugins/tree/main/plugins/marker-improvements-plugin
ui:
  javascript:
    - marker-symbols.js
settings:
  tagStyles:
    displayName: Custom styles per tag
    description: "Format: name { css } — repeat for more rules. Example: Violin { outline: 2px solid gold } Piano, Cello { opacity: .6 } * { filter: grayscale(1) }. A rule applies to every tag whose name contains that text (upper/lower case ignored). With * in a name it's a pattern for the whole name: Solo* = starts with Solo, *Concerto = ends with Concerto. Separate several names with commas; * alone means every icon. Later rules win over earlier ones."
    type: STRING
  bubbleStyles:
    displayName: Custom styles per bubble
    description: "Same format as Custom styles per tag, but the CSS goes on the whole bubble of a marker. A rule applies when any of the marker's tags (with or without an image) contains its text, or matches it as a pattern when it has a * (e.g. Solo*). Example: Concerto { background: #ffe9b0; border: 2px solid #c90 } Solo { transform: scale(1.2); transform-origin: left bottom }. * means every bubble."
    type: STRING
  styleParentTags:
    displayName: Custom styles also match parent tags
    description: "When on, a rule in either custom style setting also applies to a tag if any tag above it (its parents, their parents, …) contains the rule's text. E.g. Strings { outline: 2px solid gold } then also styles Violin, Viola and Cello if they're sub-tags of Strings."
    type: BOOLEAN
  showStashMarkerList:
    displayName: Also show Stash's own marker list
    description: "Off: in a scene's Markers tab, only this plugin's marker list (screenshots, details, edit in place) is shown, and Stash's own list below it is hidden. On: both are shown."
    type: BOOLEAN
  editMarkerOnClick:
    displayName: Click on a marker opens the edit marker dialog
    description: "Clicking a marker's icon, or its colored range on the scrubber, jumps to it and opens Stash's edit marker dialog. Switch off to only jump to the marker."
    type: BOOLEAN
