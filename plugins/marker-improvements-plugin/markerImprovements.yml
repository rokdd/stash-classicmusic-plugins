name: Marker Improvements
description: "Shows every one of a scene marker's tags that has an image, mounted directly inside Stash's own colored marker indicator on the video scrubber, so it shows and hides right along with that indicator. Click an icon to jump to that marker."
version: 0.0.1
url: https://github.com/rokdd/stash-classicmusic-plugins/tree/main/plugins/marker-improvements-plugin
ui:
  javascript:
    - marker-symbols.js
settings:
  tagStyles:
    displayName: Custom styles per tag
    description: "Format: name { css } — repeat for more rules. Example: Violin { outline: 2px solid gold } Piano, Cello { opacity: .6 } * { filter: grayscale(1) }. A rule applies to every tag whose name contains that text (upper/lower case ignored); separate several names with commas; * means every icon. Later rules win over earlier ones."
    type: STRING
  disableEditOnClick:
    displayName: Don't open the marker editor on click
    description: "Off (the default): clicking a marker's colored range on the scrubber, or one of its icons, jumps to it and opens Stash's edit form for it in the Markers tab. Turn on to only jump to the marker."
    type: BOOLEAN
