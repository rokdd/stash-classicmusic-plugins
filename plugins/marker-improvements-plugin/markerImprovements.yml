name: Marker Improvements
description: "Shows every one of a scene marker's tags that has an image, positioned at that marker's exact timestamp on the video scrubber. Hidden until the scrubber is hovered, dragged, touched, or focused, so it stays out of the way otherwise. Click an icon to jump to that marker."
