name: Scrape Tag Merge
description: "When you scrape a scene from its Edit tab (a scraper or StashDB), the scraped tags are added to the scene's existing tags instead of replacing them. You can still remove tags in the scrape dialog before applying."
version: 0.0.1
url: https://github.com/rokdd/stash-classicmusic-plugins/tree/main/plugins/scrape-tag-merge
ui:
  javascript:
    - scrape-tag-merge.js
settings:
  replaceTags:
    displayName: Replace tags instead (Stash's default)
    description: "Off (the default): scraping a scene offers its existing tags plus the scraped ones. On: the scraped tags replace the existing ones, as in Stash without this plugin."
    type: BOOLEAN
