name: StashDB Tag Descriptions
description: "Copies tag descriptions from StashDB for every tag that has a StashDB ID — right away for new or newly linked tags, and again every few days. Descriptions you wrote yourself are kept."
version: 0.0.1
url: https://github.com/rokdd/stash-classicmusic-plugins/tree/main/plugins/stashdb-tag-descriptions
exec:
  - python
  - "{pluginDir}/stashdb_tag_descriptions.py"
interface: raw
ui:
  javascript:
    - auto-refresh.js
hooks:
  - name: Fetch description for a new or newly linked tag
    description: When a tag is created, or its StashDB ID is set or changed, fetch its description from StashDB.
    triggeredBy:
      - Tag.Create.Post
      - Tag.Update.Post
    defaultArgs:
      mode: hook
tasks:
  - name: Update tag descriptions from StashDB
    description: Fetches the description of every tag that has a StashDB ID. Empty descriptions are filled; ones this plugin wrote before are updated; ones you wrote yourself are kept unless "Overwrite" is on.
    defaultArgs:
      mode: sync_all
settings:
  refreshDays:
    displayName: Refresh every … days
    description: "How often all tag descriptions are fetched again automatically, while Stash is open in a browser. Leave empty for every 7 days; 0 switches the automatic refresh off (the task in Settings → Tasks still works)."
    type: NUMBER
  overwrite:
    displayName: Overwrite descriptions you wrote yourself
    description: "Off: only empty descriptions, and ones this plugin wrote earlier, are replaced. On: every description is replaced with StashDB's."
    type: BOOLEAN
