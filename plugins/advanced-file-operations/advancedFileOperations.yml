name: Advanced File Operations
description: "Per-scene and library video tools for Stash — H265 conversion (re-encodes non-HEVC video to H.265 at a visually lossless CRF, skipping anything already converted), Split at markers (cuts a scene's file into a new scene per chosen marker, carrying title, details, date, studio, performers, tags, URLs/StashDB IDs and the relevant markers into each part), and Repair (detects a corrupt file by decoding it end to end, fixes it with a lossless remux or a tolerant re-encode, and is safe to run on a healthy file)."
version: 0.0.1
url: https://github.com/yourname/stash-advanced-file-operations
exec:
  - python
  - "{pluginDir}/h265_transcode.py"
interface: raw
ui:
  javascript:
    - h265-ui.js
tasks:
  - name: Convert Library to H265 (replace originals)
    description: Transcodes every non-H265 scene to H.265 and replaces the original file. Frees the most space but is not reversible.
    defaultArgs:
      mode: convert_library
      keep_original: "false"
  - name: Convert Library to H265 (keep originals)
    description: Same scan, but writes each converted file as "<name>.h265.mp4" next to the original instead of overwriting it.
    defaultArgs:
      mode: convert_library
      keep_original: "true"
  - name: Split Scene at Markers (keep original)
    description: Not run directly — triggered per-scene from the scene page's "Split at Markers" button. Cuts the file at every marker, carries markers/title/performers/tags/studio into each new part, and keeps the original file untouched.
    defaultArgs:
      mode: split_scene
      keep_original: "true"
  - name: Repair Corrupt Scene File
    description: Not run directly — triggered per-scene from the scene page's "Repair File" button. Checks the file for decode errors, tries a lossless remux first, falls back to a tolerant re-encode if needed, and rescans the result into Stash.
    defaultArgs:
      mode: repair_scene
      keep_original: "true"
