name: Scene Improvements
description: "Video tools for Stash — per scene: H.265 conversion, split at markers, and repair (corrupt files and files that stream badly). On a File Tools page: a torrent check (which videos in your .torrent files are already in the library, with match certainty) and downloads with yt-dlp into your library."
version: 0.0.10
url: https://github.com/rokdd/stash-classicmusic-plugins/tree/main/plugins/advanced-file-operations
exec:
  - python
  - "{pluginDir}/h265_transcode.py"
interface: raw
ui:
  javascript:
    - h265-ui.js
    - task-history.js
    - file-tools.js
tasks:
  - name: Convert Library to H265 (replace originals)
    description: Transcodes every non-H265 scene to H.265 and replaces the original file. Frees the most space but is not reversible.
    defaultArgs:
      mode: convert_library
      keep_original: "false"
  - name: Convert Library to H265 (keep originals)
    description: Same scan, but writes each converted file as "<name>.h265.mp4" next to the original, attaches it to the same scene as the new primary file, and leaves the original in place as a secondary file — nothing is deleted.
    defaultArgs:
      mode: convert_library
      keep_original: "true"
  - name: Split Scene at Markers (keep original)
    description: Not run directly — triggered per-scene from the scene page's "Split at Markers" button. Cuts the file at every marker, carries markers/title/performers/tags/studio into each new part, and keeps the original file untouched.
    defaultArgs:
      mode: split_scene
      keep_original: "true"
  - name: Repair Corrupt Scene File
    description: Not run directly — triggered per-scene from the scene page's "Repair File" button. Checks the file for decode errors, tries a lossless remux first, falls back to a tolerant re-encode if needed, and rescans the result into Stash.
    defaultArgs:
      mode: repair_scene
      keep_original: "true"
settings:
  torrentFolder:
    displayName: Torrent folder
    description: "Folder(s) on the server with the .torrent files the torrent check reads — several separated by ; (e.g. /data/torrents; /data/watch). The check runs for them as soon as you open the Torrent check tab (Settings → Tools); you can enter others there for a single check."
    type: STRING
  historyIgnore:
    displayName: "Task history: ignore"
    description: "Tasks to leave out of the task history, separated by commas. A name without * matches every task whose description contains it; with * it's a pattern for the whole description. Example: Scan*, Generate*, (automatic)"
    type: STRING
  ytdlpPath:
    displayName: Path to yt-dlp
    description: "Leave empty if yt-dlp is on the server's PATH (e.g. installed with apt install yt-dlp). Otherwise the full path, e.g. /usr/local/bin/yt-dlp."
    type: STRING
  cookiesFile:
    displayName: Cookies file
    description: "Optional: the path on the server to a cookies.txt (Netscape format) for sites that need you to be logged in."
    type: STRING
  extraArgs:
    displayName: Extra yt-dlp options
    description: "Optional: more options passed to yt-dlp as they are, e.g. --limit-rate 5M --embed-subs."
    type: STRING
