name: yt-dlp Downloader
description: "Download videos or whole playlists with yt-dlp straight into one of your library folders, from a button in Stash's top bar. Each new scene gets its title, source URL, upload date, description and thumbnail as cover filled in automatically."
version: 0.0.2
url: https://github.com/rokdd/stash-classicmusic-plugins/tree/main/plugins/yt-dlp-downloader
exec:
  - python
  - "{pluginDir}/ytdlp_downloader.py"
interface: raw
ui:
  javascript:
    - ytdlp-ui.js
settings:
  ytdlpPath:
    displayName: Path to yt-dlp
    description: "Leave empty if yt-dlp is on the server's PATH (e.g. installed with apt install yt-dlp). Otherwise the full path, e.g. /usr/local/bin/yt-dlp."
    type: STRING
  cookiesFile:
    displayName: Cookies file
    description: "Optional: the path on the server to a cookies.txt (Netscape format) for sites that need you to be logged in."
    type: STRING
  extraArgs:
    displayName: Extra yt-dlp options
    description: "Optional: more options passed to yt-dlp as they are, e.g. --limit-rate 5M --embed-subs."
    type: STRING
