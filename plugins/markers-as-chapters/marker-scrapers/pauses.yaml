# Markers where the music starts again after a pause (between movements or
# works), found in the scene's own audio with ffmpeg. With a list of titles
# (one per line), it finds as many pieces as there are titles and names them.
name: Pauses between movements
description: "Splits the video at the pauses in its audio: a marker starts where the music starts again and ends where the next pause begins (“Part 1”, “Part 2” …). Paste the titles of the movements or works in the order they're played, one per line (e.g. from the broadcaster's programme), to name them — the longest pauses then split the video into that many pieces. Lines that are empty or only a time are skipped."
markerByFragment:
  action: script
  timeout: 1200
  script:
    - python
    - pauses.py
markerByText:
  action: script
  timeout: 1200
  script:
    - python
    - pauses.py
