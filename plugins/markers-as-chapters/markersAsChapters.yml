name: Markers as Chapters
description: "Imports a scene's chapters as markers, the way Stash scrapes scenes: chapters in the video file or in a file next to it, online chapters (YouTube, ZDF … via yt-dlp; arte.tv / ARTE Concert; ORF ON), a pasted tracklist or text file, or a programme without times placed at the pauses between movements. Every import is checked against the pauses in the audio (shift or snap the markers onto them) in a review dialog before anything is created. Add your own marker scrapers as .yaml files."
version: 0.0.23
url: https://github.com/rokdd/stash-classicmusic-plugins/tree/main/plugins/markers-as-chapters
exec:
  - python
  - "{pluginDir}/marker_scrapers.py"
interface: raw
ui:
  javascript:
    - markers-as-chapters.js
tasks:
  - name: Composers from marker titles (all scenes)
    description: For every marker in the library — composer tags (under "Fill in tags under", default Composers) named in its title by name, alias or surname are added, and the title loses the names. Primary tag, times and other tags stay. Each change is logged. For one scene with a preview first, use Scrape markers… → Composers from the titles… instead.
    defaultArgs:
      mode: marker_composers
      apply: "true"
settings:
  scrapedMarkerTag:
    displayName: Primary tag for scraped markers
    description: "Every marker needs a primary tag. Imported markers get this one when the scraper doesn't name one (you can change it in the scrape dialog). Created if it doesn't exist yet. Empty: Chapter."
    type: STRING
  markerScrapersPath:
    displayName: Marker scrapers folder
    description: "Optional: a folder on the server with marker scrapers of your own — .yaml files like Stash's scrapers, with markerByFragment, markerByURL and/or markerByText (action: script). See the plugin's README. The built-in ones (video file chapters, chapter files, online chapters, arte.tv, ORF ON, subtitles, plain text) are always there."
    type: STRING
  ytdlpPath:
    displayName: Path to yt-dlp
    description: "For the online chapters scraper. Leave empty to use Scene Improvements' setting if it has one, else yt-dlp on the server's PATH."
    type: STRING
  suggestTagsUnder:
    displayName: Fill in tags under
    description: "Tags below these parent tags (comma-separated) are filled in when a marker's title names them — the whole name, an alias, or just the surname (Beethoven: Symphony No. 5 → Ludwig van Beethoven). Made for the composer tags Tag Improvements keeps. Empty: Composers, Soloists. A single - switches it off."
    type: STRING
  skipPauseCheck:
    displayName: Skip the check against the audio
    description: "Off (the default): the review dialog checks the markers against the pauses in the scene's audio — shows which start at a pause, suggests a shift, and can snap them onto the pauses. On: no check (e.g. on a slow server)."
    type: BOOLEAN
  noChapterOffer:
    displayName: Don't offer chapters found
    description: "Off (the default): when a scene without markers is opened (or its URLs change), the quick sources are checked — a chapter file next to the video (also a medici.tv JSON), the video's own chapters, ARTE / ORF ON — and a note offers to import what's found. On: no checking, no note."
    type: BOOLEAN
