name: Markers as Chapters
description: "Imports a scene's chapters as markers, the way Stash scrapes scenes: chapters in the video file or in a file next to it, online chapters (YouTube, ZDF … via yt-dlp; arte.tv / ARTE Concert; ORF ON), a pasted tracklist or text file, or a programme without times placed at the pauses between movements. Every import is checked against the pauses in the audio (shift or snap the markers onto them) in a review dialog before anything is created. Add your own marker scrapers as .yaml files."
version: 0.0.54
url: https://github.com/rokdd/stash-classicmusic-plugins/tree/main/plugins/markers-as-chapters
exec:
  - python
  - "{pluginDir}/marker_scrapers.py"
interface: raw
ui:
  javascript:
    - markers-as-chapters.js
tasks:
  - name: Composers from marker titles (all scenes)
    description: For every marker in the library — composer tags (under "Fill in tags under", default Composers) named in its title by name, alias or surname are added, and the title loses the names. Primary tag, times and other tags stay. Each change is logged. For one scene with a preview first, use Scrape markers… → Composers from the titles… instead.
    defaultArgs:
      mode: marker_composers
      apply: "true"
  - name: Remember each marker's file
    description: "For every scene with one file: its markers were made on that file. Run it once — before merging scenes or adding files — so that afterwards Markers as Chapters knows which markers belong to which file and can line them up with the primary file. New markers are remembered by themselves."
    defaultArgs:
      mode: marker_remember_all
  - name: Composers of scenes and chapters in step (all scenes)
    description: "For every scene with markers: a chapter's composer (a tag under Composers) is added to the scene's performers; when the scene has exactly one composer, chapters without a composer get its tag (and follow when it changes). What you removed yourself — from a chapter or from the scene — isn't added again. Runs by itself when a scene or marker is saved."
    defaultArgs:
      mode: composer_sync_all
hooks:
  - name: Remember a marker's file, keep composers in step
    description: When a marker is created or its time changed, remember the scene's primary file as the file it was set on — so after merging scenes or changing the primary file its time can be lined up with the new primary file. And when a scene or a marker is saved, keep the composers of scene and chapters in step (see the task) unless switched off in the settings.
    triggeredBy:
      - SceneMarker.Create.Post
      - SceneMarker.Update.Post
      - SceneMarker.Destroy.Post
      - Scene.Update.Post
    defaultArgs:
      mode: marker_hook
settings:
  scrapedMarkerTag:
    displayName: Primary tag for scraped markers
    description: "Every marker needs a primary tag. Imported markers get this one when the scraper doesn't name one (you can change it in the scrape dialog). Created if it doesn't exist yet. Empty: Chapter."
    type: STRING
  markerScrapersPath:
    displayName: Marker scrapers folder
    description: "Optional: a folder on the server with marker scrapers of your own — .yaml files like Stash's scrapers, with markerByFragment, markerByURL and/or markerByText (action: script). See the plugin's README. The built-in ones (video file chapters, chapter files, online chapters, arte.tv, ORF ON, subtitles, plain text) are always there."
    type: STRING
  ytdlpPath:
    displayName: Path to yt-dlp
    description: "For the online chapters scraper. Leave empty to use Scene Improvements' setting if it has one, else yt-dlp on the server's PATH."
    type: STRING
  suggestTagsUnder:
    displayName: Fill in tags under
    description: "Tags below these parent tags (comma-separated) are filled in when a marker's title names them — the whole name, an alias, or just the surname (Beethoven: Symphony No. 5 → Ludwig van Beethoven). Made for the composer tags Tag Improvements keeps. Empty: Composers, Soloists. A single - switches it off."
    type: STRING
  skipPauseCheck:
    displayName: Skip the check against the audio
    description: "Off (the default): the review dialog checks the markers against the pauses in the scene's audio — shows which start at a pause, suggests a shift, and can snap them onto the pauses. On: no check (e.g. on a slow server)."
    type: BOOLEAN
  openSubtitlesApiKey:
    displayName: OpenSubtitles API key
    description: "For Subtitles from OpenSubtitles: an API key from opensubtitles.com — free, after signing up, under API consumers."
    type: STRING
  openSubtitlesUser:
    displayName: OpenSubtitles username
    description: "Your opensubtitles.com username — needed to download subtitles (a free account allows about 20 a day)."
    type: STRING
  openSubtitlesPassword:
    displayName: OpenSubtitles password
    description: "Your opensubtitles.com password. Stored as plain text in Stash's plugin settings, like every plugin setting."
    type: STRING
  openSubtitlesLanguages:
    displayName: OpenSubtitles languages
    description: "Languages to look for, in order of preference, as two-letter codes separated by commas. Empty: de,en."
    type: STRING
  tmdbApiKey:
    displayName: TMDB API key
    description: "For the TMDB scene scraper (a scraper of this repository, not of this plugin): the API key or API Read Access Token from themoviedb.org → Settings → API. Scrapers have no settings of their own in Stash, so it's kept here."
    type: STRING
  tmdbLanguage:
    displayName: TMDB language
    description: "For the TMDB scraper: e.g. de-DE, en-US. Empty: de-DE."
    type: STRING
  tvdbApiKey:
    displayName: TVDB API key
    description: "For the TVDB scene scraper (a scraper of this repository): the API key from thetvdb.com → Dashboard → API keys."
    type: STRING
  tvdbPin:
    displayName: TVDB subscriber PIN
    description: "For the TVDB scraper: only for a user-supported API key — your TVDB subscriber PIN."
    type: STRING
  tvdbLanguage:
    displayName: TVDB language
    description: "For the TVDB scraper: three letters, e.g. deu, eng. Empty: deu."
    type: STRING
  composerSyncOff:
    displayName: Don't keep composers of scene and chapters in step
    description: "Off (the default): when a scene or a marker is saved, a chapter's composer is added to the scene's performers, and chapters without a composer get the scene's composer (if it has exactly one). On: neither."
    type: BOOLEAN
  tesseractPath:
    displayName: tesseract
    description: "For Text in the picture (OCR): the path of tesseract on the Stash server. Empty: tesseract on the PATH (Debian / Ubuntu: apt install tesseract-ocr tesseract-ocr-deu; Stash's Docker image: apk add tesseract-ocr tesseract-ocr-data-deu)."
    type: STRING
  ocrLanguages:
    displayName: Languages of text in the picture
    description: "For Text in the picture (OCR): languages as two-letter codes separated by commas (each needs tesseract's language pack; each one more makes reading slower). Empty: the first of the OpenSubtitles languages, else de."
    type: STRING
