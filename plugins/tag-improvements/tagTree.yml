name: Tag Improvements
description: "Tag tools for Stash: a collapsible tree of all tags on the Tags page (with images, descriptions and counts); tag descriptions copied from StashDB and kept up to date; and scraping a scene from its Edit tab adds the scraped tags to the existing ones instead of replacing them."
version: 0.0.8
url: https://github.com/rokdd/stash-classicmusic-plugins/tree/main/plugins/tag-improvements
exec:
  - python
  - "{pluginDir}/stashdb_tag_descriptions.py"
interface: raw
ui:
  javascript:
    - tag-tree.js
    - stashdb-auto-refresh.js
    - scrape-tag-merge.js
hooks:
  - name: Fetch description for a new or newly linked tag
    description: When a tag is created, or its StashDB ID is set or changed, fetch its description from StashDB.
    triggeredBy:
      - Tag.Create.Post
      - Tag.Update.Post
    defaultArgs:
      mode: hook
tasks:
  - name: Update tag descriptions from StashDB
    description: Fetches the description of every tag that has a StashDB ID. Empty descriptions are filled; ones this plugin wrote before are updated; ones you wrote yourself are kept unless "Overwrite" is on.
    defaultArgs:
      mode: sync_all
settings:
  replaceTags:
    displayName: Replace tags instead (Stash's default)
    description: "Off (the default): scraping a scene from its Edit tab offers its existing tags plus the scraped ones. On: the scraped tags replace the existing ones, as in Stash without this plugin."
    type: BOOLEAN
  showNavbarButton:
    displayName: Show a tag tree button in the top bar
    description: "Adds a button to Stash's top navigation bar that opens the Tags page in tree view. Off: the tree is still there as the Tree view on the Tags page."
    type: BOOLEAN
  refreshDays:
    displayName: Refresh every … days
    description: "How often all tag descriptions are fetched again automatically, while Stash is open in a browser. Leave empty for every 7 days; 0 switches the automatic refresh off (the button on the tag tree page and the task in Settings → Tasks still work)."
    type: NUMBER
  overwrite:
    displayName: Overwrite descriptions you wrote yourself
    description: "Off: only empty descriptions, and ones this plugin wrote earlier, are replaced. On: every description is replaced with StashDB's."
    type: BOOLEAN
