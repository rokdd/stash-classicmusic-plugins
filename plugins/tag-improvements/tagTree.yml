name: Tag Improvements
description: "Tag tools for Stash: a collapsible tree of all tags on the Tags page (with images, descriptions and counts); tag descriptions copied from StashDB and kept up to date; scraping a scene from its Edit tab adds the scraped tags to the existing ones instead of replacing them; and a tag for every composer (performers with a composer custom field), kept in step."
version: 0.0.11
url: https://github.com/rokdd/stash-classicmusic-plugins/tree/main/plugins/tag-improvements
exec:
  - python
  - "{pluginDir}/stashdb_tag_descriptions.py"
interface: raw
ui:
  javascript:
    - tag-search.js
    - tag-tree.js
    - stashdb-auto-refresh.js
    - scrape-tag-merge.js
hooks:
  - name: Fetch description for a new or newly linked tag
    description: When a tag is created, or its StashDB ID is set or changed, fetch its description from StashDB.
    triggeredBy:
      - Tag.Create.Post
      - Tag.Update.Post
    defaultArgs:
      mode: hook
  - name: Keep a composer's tag in step
    description: When a performer is created or saved and is marked as a composer (custom field, see the Composer field setting), creates or updates their tag under the composer parent tag — name, aliases, image, description.
    triggeredBy:
      - Performer.Create.Post
      - Performer.Update.Post
    defaultArgs:
      mode: composer_hook
tasks:
  - name: Update tag descriptions from StashDB
    description: Fetches the description of every tag that has a StashDB ID. Empty descriptions are filled; ones this plugin wrote before are updated; ones you wrote yourself are kept unless "Overwrite" is on.
    defaultArgs:
      mode: sync_all
  - name: Sync composer tags
    description: Gives every performer marked as a composer (custom field, see the Composer field setting) a tag of their own under the composer parent tag, and brings existing ones up to date — name, aliases, image, description.
    defaultArgs:
      mode: sync_composers
settings:
  plainTagSearch:
    displayName: Use Stash's plain tag search
    description: "Off (the default): tag fields everywhere find tags by every word you type, in any order, in the tag's name, aliases, description and parent tags' names. On: Stash's own search (name and aliases, as typed)."
    type: BOOLEAN
  largeTagDropdown:
    displayName: Large tag dropdown
    description: "Tag dropdowns use most of the window's height, show each tag's image and description, and close once a tag is picked."
    type: BOOLEAN
  replaceTags:
    displayName: Replace tags instead (Stash's default)
    description: "Off (the default): scraping a scene from its Edit tab offers its existing tags plus the scraped ones. On: the scraped tags replace the existing ones, as in Stash without this plugin."
    type: BOOLEAN
  showNavbarButton:
    displayName: Show a tag tree button in the top bar
    description: "Adds a button to Stash's top navigation bar that opens the Tags page in tree view. Off: the tree is still there as the Tree view on the Tags page."
    type: BOOLEAN
  refreshDays:
    displayName: Refresh every … days
    description: "How often all tag descriptions are fetched again automatically, while Stash is open in a browser. Leave empty for every 7 days; 0 switches the automatic refresh off (the button on the tag tree page and the task in Settings → Tasks still work)."
    type: NUMBER
  overwrite:
    displayName: Overwrite descriptions you wrote yourself
    description: "Off: only empty descriptions, and ones this plugin wrote earlier, are replaced. On: every description is replaced with StashDB's."
    type: BOOLEAN
  composerField:
    displayName: Composer field
    description: "The performer custom field that marks a composer (Edit performer → Custom Fields). Any value but no / false / 0 counts. Each composer gets a tag of their own, so markers can carry them. Empty: composer."
    type: STRING
  composerParentTag:
    displayName: Composer parent tag
    description: "The tag the composer tags go under — created if it doesn't exist. Empty: Composers."
    type: STRING
